name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  scoring:
    name: clinical scoring unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run scoring tests
        run: node --test
